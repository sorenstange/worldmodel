experiment_name: worldmodel

data:
  symbols:
     - 'BTCUSDT'
     - 'ETHUSDT'
     - 'SOLUSDT'
     - 'XRPUSDT'
     - 'HYPEUSDT'
     - 'SUIUSDT'
     - 'BNBUSDT'
     - 'ZECUSDT'
     - 'LINKUSDT'
     - 'AAVEUSDT'
     - 'WLDUSDT'
     - 'ONDOUSDT'
     - 'XLMUSDT'
  timeframe: '1m'
  normalization_window: 1440   # 1 day of 1m bars
  vol_window_short: 60         # short leg of the vol-regime feature
  window_size: 15              # 1m bars per window -> the model's timestep is 15m
  sequence_length: 64          # windows per sequence -> 16h of context
  stride: 32                   # training only: 50% overlap as augmentation
  eval_stride: 64              # val/test: disjoint windows, no double counting
  returns:
    # Units are SIGMA, not percent: the target is the window return divided by a
    # causal realised-vol estimate. Raw percent is not comparable across symbols
    # (SOL's 15m sigma is ~1.9x BTC's), which defeats multi-symbol training.
    num_bins: 61
    min_value: -5.0
    max_value: 5.0
  actions:
    num_bins: 51
    min_value: -1.0
    max_value: 1.0
    commission_value: 0.0005   # 5 bps, charged on |change in allocation|
    loss_fn: 'sortino'          # oracle objective: 'equity' | 'sortino' | 'sharpe' (see util.LOSS_FNS)
    constrained: true          # apply the turnover penalty below on top of loss_fn
    max_change: 0.2            # oracle turnover constraint, per 15m step
    penalty_weight: 1000.0
    opt_steps: 1000
    opt_lr: 0.01
  training_interval:
    - '2018-01-01 00:00'
    - '2025-01-01 00:00'
  validation_interval:
    - '2025-01-01 00:00'
    - '2026-01-01 00:00'
  test_interval:
    - '2026-01-01 00:00'
    - '2026-06-01 00:00'

jepa:
  name: 'jepa'
  input_dim: 6 # [Open, High, Low, Close, Volume, Volatility]
  d_model: 256
  # Loss weights.
  lam_state: 1.0
  lam_CE: 1.0
  lam_SIGReg: 0.1     # anti-collapse; 0.0 reproduces the collapsing setup
  lam_rollout: 0.5    # multi-step rollout term; 0.0 = pure teacher forcing
  sigreg:
    knots: 17
    num_proj: 1024
  encoder:
    num_layers: 6
    num_heads: 8      # head_dim 32
    ff_mult: 4
    max_len: ${eval:'${data.window_size} + 1'}
    dropout: 0.1
  predictor:
    num_layers: 8
    num_heads: 8      # head_dim 32
    ff_mult: 4
    max_len: ${data.sequence_length}
    dropout: 0.1
  return_head:
    num_bins: ${data.returns.num_bins}
    min_value: ${data.returns.min_value}
    max_value: ${data.returns.max_value}
    dropout: 0.1
  training:
    lr: 0.0003
    weight_decay: 0.01
    warmup_steps: 2000        # in STEPS, not epochs
    sched_steps: null         # null -> derive from max_epochs x steps/epoch
    epochs: 200               # keep patience < epochs or the cosine never decays
    batch_size: 128
    rollout_steps: 8          # horizon of the autoregressive term
    rollout_batch: 32         # sub-batch for it; k passes are held for backprop
    log_every_n_steps: 10
    patience: 40

actor:
  name: 'actor'
  input_dim: ${jepa.d_model}
  d_model: 256
  backbone:
    num_layers: 8
    num_heads: 8
    ff_mult: 4
    max_len: ${data.sequence_length}
    dropout: 0.1
  action_head:
    num_bins: ${data.actions.num_bins}
    min_value: ${data.actions.min_value}
    max_value: ${data.actions.max_value}
    dropout: 0.1
  ar:
    ctx_len: 1         # 2h of real context before the policy takes over
    pred_steps: 32     # each step is a sequential backbone pass held for backprop
    batch_size: 256     # ...so this must be far below the teacher-forced batch
  eval:
    # Shared by Actor and ActorAR so the two are scored identically.
    ctx_len: 1         # >= 1; the policy self-feeds from the first step, flat
    pred_steps: null   # null = roll to the end of the sequence
    val_pred_steps: 24 # in-training monitor is capped -- each step is a
                       # sequential forward pass, and validation runs every epoch
  training:
    lr: 0.0003
    weight_decay: 0.01
    warmup_steps: 2000
    sched_steps: null
    epochs: 200
    batch_size: 256
    log_every_n_steps: 10
    patience: 40
  test:
    batch_size: 128
    act_temp: 1.0
    num_plots: 20

rl:
  # Stage 3. Fine-tunes the behaviour-cloned actor; see the module docstring in
  # src/rl.py for why these defaults are what they are.
  name: 'actor-rl'
  from_ar: false        # warm start from actor-AR instead of actor
  objective: 'ppo'      # 'ppo' | 'analytic' (exact gradient through the reward)
  env: 'real'           # 'real' | 'dream' | 'mixed'
  dream_prob: 0.5       # only used by 'mixed'
  dream_temp: 1.0       # sampling temperature of the world model's return head
  ctx_len: 1            # real windows before the policy takes over
  pred_steps: 32        # episode length; each step is a sequential backbone pass
  act_temp: 1.0
  disable_dropout: true # PPO's ratio is only a trust region if collection and
                        # update see the same network
  gamma: 1.0            # the undiscounted sum of log returns IS terminal equity
  gae_lambda: 0.0       # an action influences its own step and the next
                        # turnover charge, and nothing further; anything above
                        # ~0.2 folds in market noise it had no say in
  reward:
    # Rewards are log growth in BASIS POINTS. Raw 15m log growth is O(1e-4), so
    # at scale 1.0 every coefficient in this block -- and kl_coef/ent_coef below
    # -- sits orders of magnitude above the objective it regularises.
    scale: 10000.0
    # Unconditional drift removal. Without it the training split's drift IS the
    # objective: Kelly f* = mu/sigma^2 is 1.08 over [data.training_interval],
    # which the [-1, 1] box clips to +1, so "always fully long" is the exact
    # argmax of undiscounted log equity. It is -1.60 over [data.test_interval],
    # where the drift flips sign. 'ema' subtracts a running mean of the realised
    # window return, so a constant allocation earns ~0 and only timing pays.
    # 'const' uses `drift` below instead; 'none' restores the old behaviour.
    demean: 'ema'
    drift_beta: 0.99    # EMA rate, shared with the return-scale tracker
    drift: 0.0          # only used by demean: 'const'
    # 'bh' scores log(dE / dE_buy_and_hold), so an episode return is
    # log(E_actor / E_bh) -- the primary definition of done -- and buy-and-hold
    # scores exactly 0 instead of winning. This is PPO's missing baseline. Note
    # it leaves the analytic-logeq optimum unchanged (a constant offset in log
    # space); `demean` is what moves that one. Use both.
    benchmark: 'bh'     # 'none' | 'bh'
    # Both shaping terms are LINEAR in the reward's own units (bps). Quadratic
    # shaping cannot be scale-coherent -- the coefficient ends up carrying units.
    downside_coef: 0.0  # loss aversion: 1.0 = a bp lost counts twice a bp gained
    max_change: null    # optional turnover cap, mirroring the oracle's
    turnover_penalty: 0.0  # extra bps per unit of change beyond the cap
                           # (commission_value is 5 bps, for scale)
  ppo:
    clip: 0.2
    epochs: 4
    minibatch: 64       # over SEQUENCES; the time axis stays intact
    vf_coef: 0.5        # the value target is normalised, so this is O(1) vs O(1)
    ent_coef: 0.001
    kl_coef: 0.02       # to the frozen BC policy -- the load-bearing
                        # regulariser. norm_adv makes the surrogate O(1), so
                        # this is ~2% of it; 0.02-0.5 is the range worth sweeping
    norm_adv: true
    center_adv: true    # subtract the batch mean at each timestep -- a free
                        # time-varying baseline the zero-init critic cannot give
    target_kl: null     # e.g. 0.02 to cut the inner loop short
  analytic:
    objective: 'logeq'  # 'logeq' (bps/step, O(0.3)) | 'sortino' (dimensionless
                        # per-step ratio, O(0.01) -- two orders smaller, so
                        # raise obj_scale ~100x when switching to it)
    obj_scale: 1.0
    ent_coef: 0.0
    kl_coef: 1.0        # was 0.02 against an objective of O(1e-3): the KL was
                        # ~20x the entire objective and the run could not move

  critic:
    detach_trunk: false
    warmup_updates: 200 # critic-only updates before the policy starts moving
  training:
    lr: 0.00002         # a fine-tune, not a fresh fit -- far below the BC lr
    weight_decay: 0.01
    warmup_steps: 200
    sched_steps: null
    epochs: 60
    batch_size: 64      # collection holds pred_steps sequential passes
    log_every_n_steps: 10
    patience: 15
